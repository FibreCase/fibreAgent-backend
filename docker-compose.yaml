# Agent Backend — single-service deployment.
#
#   cp .env.example .env               # same file the plain `uv run` uses
#   docker compose up -d --build
#   docker compose logs -f
#
# The app is outbound-only (Telegram long polling + LLM API): nothing to expose.

services:
  agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fibrecase-agent-backend
    container_name: fibrecase-agent-backend

    # Same .env as the local `uv run fibrecase-agent-backend` — one config
    # file for both. It is passed at runtime (env_file) and is NOT baked into
    # the image (.dockerignore excludes it).
    env_file:
      - .env

    # Match the host timezone so the app's local time is correct. The image
    # defaults to UTC, otherwise `get_current_time` (datetime.now()) and the
    # log timestamps would be a few hours off from your wall clock. Set TZ in
    # .env to your zone (e.g. Asia/Shanghai). This is the portable way — the
    # image already ships tzdata, and macOS has no /etc/localtime to bind-mount.
    # (Explicit `environment` wins over env_file if TZ is also in .env.)
    environment:
      - TZ=${TZ:-Asia/Shanghai}

    # Run the container as the *host* user so the bind-mounted ./data keeps
    # normal host permissions (owned by you, 755) AND is writable by the
    # container — no chown, and the DB stays readable from the host.
    # Set HOST_UID/HOST_GID in .env to your uid/gid (`id -u` / `id -g`).
    #   Linux desktop first user: 1000 · macOS default user: 501
    # (If you'd rather keep the dedicated uid 10001, drop this line and use a
    # named volume instead of the bind mount — see README 12.)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Persist the SQLite conversation store across restarts and image rebuilds.
    # ./data is shared with the local `uv run` — same file, same permissions.
    volumes:
      - ./data:/app/data
    # Optional: point at a different system prompt without rebuilding the image:
    # - ./config/system_prompt.txt:/app/config/system_prompt.txt:ro

    # Restart if it exits (OOM, transient LLM/Telegram hiccup, host reboot).
    # The bot is a single long-running process; this keeps it up.
    restart: unless-stopped

    # Outbound-only long polling — no inbound ports.
