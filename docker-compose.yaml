# Agent Backend — single-service deployment.
#
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose logs -f
#
# Why each setting (shared .env, host-uid mount, timezone, inbound/OAuth ports,
# graceful shutdown) works the way it does: docs/deployment.md.

services:
  agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fibrecase-agent-backend
    container_name: fibrecase-agent-backend

    # Same .env as local `uv run`; read at runtime, never baked into the image.
    env_file:
      - .env

    # Match the host timezone (the image defaults to UTC). Set TZ in .env.
    environment:
      - TZ=${TZ:-Asia/Shanghai}

    # Run as the host user so bind-mounted ./data stays writable (no chown).
    # Set HOST_UID/HOST_GID in .env (`id -u` / `id -g`).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    # Persist SQLite + image blobs; shared with local `uv run`.
    volumes:
      - ./data:/app/data
    # Optional: use a different system prompt without rebuilding the image:
    # - ./config/system_prompt.txt:/app/config/system_prompt.txt:ro

    # Keep the single long-running bot alive across OOM / hiccups / host reboot.
    restart: unless-stopped

    # ------------------------------------------------------------------
    # Inbound ports — NONE by default (the app is outbound-only).
    #
    # Compose cannot publish a port *conditionally* on an env var, so the one
    # OAuth callback port is written here but COMMENTED OUT. Uncomment only
    # when MCP user-level OAuth is enabled (OAUTH_CALLBACK_BASE_URL set in .env):
    # the app then opens one inbound listener, GET /oauth/callback, that the
    # provider must reach. Leave it commented while OAuth is off — otherwise
    # you open an inbound port for a deployment that is purely outbound.
    # See docs/deployment.md ("OAuth 回调端口").
    #
    #   ports:
    #     - "${OAUTH_CALLBACK_PORT:-8090}:${OAUTH_CALLBACK_PORT:-8090}/tcp"
    #   # Behind a reverse proxy / tunnel, bind to loopback instead:
    #   # - "127.0.0.1:${OAUTH_CALLBACK_PORT:-8090}:${OAUTH_CALLBACK_PORT:-8090}/tcp"
