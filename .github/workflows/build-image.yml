name: Build & push Docker image

# Automatically build the Docker image and push it to the GitHub Container
# Registry whenever a tag matching "v*" is pushed (e.g. v1.0.0).
on:
  push:
    tags:
      - "v*"

# contents: read is needed to check out; packages: write is what lets the
# default GITHUB_TOKEN push to ghcr.io — no external registry secrets required.
permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (at the pushed tag)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image name + tags. On a tag push, "type=ref,event=tag" yields
      # the git tag (e.g. v1.0.0); "type=sha" adds the short commit SHA.
      # Result: ghcr.io/<owner>/<repo>:v1.0.0 and :<short-sha>.
      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs (stored in the repo's Actions cache).
          cache-from: type=gha
          cache-to: type=gha,mode=max
