# Opt-in override — ONLY for MCP user-level OAuth (phase 4.x).
#
# The base file (docker-compose.yaml) publishes NO ports so the image stays
# "no inbound ports" by default. Enabling OAuth (setting OAUTH_CALLBACK_BASE_URL
# in .env) makes the app open ONE inbound listener, GET /oauth/callback, on
# OAUTH_CALLBACK_PORT (default 8090) — the OAuth provider (e.g. Google) must be
# able to reach it, so that port has to be published.
#
# Compose cannot publish a port *conditionally* on an env var, so this lives in
# a separate file you add only while OAuth is enabled:
#
#     docker compose -f docker-compose.yaml -f docker-compose.oauth.yaml up -d --build
#
# Without it (`docker compose up -d --build`) no port is published and the app
# is purely outbound. Do NOT copy its `ports:` into the base file — that would
# open a port for everyone, even users who never enable OAuth.
#
# Note: OAUTH_CALLBACK_BASE_URL must be the *public* origin the provider hits
# (e.g. https://oauth.example.com), which need not match the host port below —
# a reverse proxy / tunnel can terminate it. Only publish to 0.0.0.0 if the
# host itself is directly reachable by the provider; otherwise bind to
# 127.0.0.1 and front it with your proxy/tunnel.

services:
  agent-backend:
    ports:
      - "${OAUTH_CALLBACK_PORT:-8090}:${OAUTH_CALLBACK_PORT:-8090}/tcp"
